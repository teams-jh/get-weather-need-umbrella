name: Hourly Umbrella Notification Pipeline

# 실발송은 이 저장소에서만 돌린다. 다른 저장소에서 같이 돌리면 같은 유저에게
# 두 번 발송을 시도하게 된다.
on:
  #schedule:
    # 매시 정각 (UTC 분 = KST 분).
    # 시간 게이트(아침·퇴근·주말)가 시 단위로 판정하므로 매시 실행을 전제한다.
   # - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  run-notification-scheduler:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Prepare Toss mTLS credentials
        env:
          TOSS_MTLS_CERT: ${{ secrets.TOSS_MTLS_CERT }}
          TOSS_MTLS_KEY: ${{ secrets.TOSS_MTLS_KEY }}
        run: |
          cert_path="$RUNNER_TEMP/toss-mtls-cert.pem"
          key_path="$RUNNER_TEMP/toss-mtls-key.pem"
          printf '%s' "$TOSS_MTLS_CERT" > "$cert_path"
          printf '%s' "$TOSS_MTLS_KEY" > "$key_path"
          chmod 600 "$cert_path" "$key_path"
          echo "TOSS_MTLS_CERT_PATH=$cert_path" >> "$GITHUB_ENV"
          echo "TOSS_MTLS_KEY_PATH=$key_path" >> "$GITHUB_ENV"

      - name: Run Umbrella Notification Scheduler
        env:
          FIREBASE_SERVICE_ACCOUNT_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_KEY }}
          # 여기가 실발송 저장소라 켠 채로 둔다. 시크릿으로 빼면 값이 비었을 때
          # real_send_enabled() 가 false 로 떨어져 모의 발송으로 조용히 바뀐다.
          ENABLE_REAL_TOSS_PUSH: 'true'
        working-directory: ./backend
        # -m 으로 실행해야 backend 가 임포트 루트가 된다.
        run: python -m scripts.run_notifications
