name: CI

# 예보 수집(weather_update.yml)과 분리된 검증 전용 워크플로.
# 수집은 시간에 매인 작업이라 테스트 실패로 멈추면 안 되고,
# 테스트는 수집 주기와 무관하게 모든 변경에서 돌아야 한다.
# push 를 모든 브랜치에 걸면 PR 브랜치는 push 와 pull_request 양쪽에 걸려
# 같은 커밋을 두 번 돌린다. 두 이벤트의 github.ref 가 달라 concurrency 로도
# 합쳐지지 않으므로, push 는 기본 브랜치만 보고 나머지는 pull_request 가 맡는다.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# 같은 브랜치에 연달아 푸시하면 이전 실행은 취소한다.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run backend test suite
        working-directory: ./backend
        # 테스트는 네트워크를 타지 않는다. 실행 환경에 키가 들어 있으면 조용히
        # 실제 API 를 호출하게 되므로, 여기서도 비워 두어 그 경로를 막는다.
        env:
          OPENWEATHER_API_KEY: ''
          KMA_SERVICE_KEY: ''
          SESSION_SECRET_KEY: ci-test-secret
        run: pytest -q
