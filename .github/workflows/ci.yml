name: CI

# 예보 수집(weather_update.yml)과 분리된 검증 전용 워크플로.
# 수집은 시간에 매인 작업이라 테스트 실패로 멈추면 안 되고,
# 테스트는 수집 주기와 무관하게 모든 변경에서 돌아야 한다.
# push 를 모든 브랜치에 걸면 PR 브랜치는 push 와 pull_request 양쪽에 걸려
# 같은 커밋을 두 번 돌린다. 두 이벤트의 github.ref 가 달라 concurrency 로도
# 합쳐지지 않으므로, push 는 기본 브랜치만 보고 나머지는 pull_request 가 맡는다.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# 같은 브랜치에 연달아 푸시하면 이전 실행은 취소한다.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # backend/ 는 need-umbrella 에서 미러링되지만 워크플로는 그대로 남는다.
      # 그래서 저쪽에서 scripts/ 의 진입점 이름을 바꾸면, 여기 워크플로는 없는
      # 모듈을 부르게 되고 다음 수집이나 발송에서야 터진다. send_test_message 는
      # 수동 전용이라 정작 필요할 때 발견된다.
      #
      # 테스트로는 못 잡는다. 진입점 4개 중 tests/ 가 임포트하는 것은
      # check_coverage 뿐이라, 나머지는 이름이 바뀌어도 pytest 가 통과한다.
      #
      # 이 잡은 push: [main] 에서도 돌기 때문에 미러링이 떨어지는 즉시 확인된다.
      # 파일 존재만 보므로 의존성 설치 앞에 둔다.
      - name: 워크플로가 부르는 backend 진입점이 실제로 있는지 확인
        run: |
          set -uo pipefail

          modules=$(grep -rhoE 'python -m scripts\.[a-z_]+' .github/workflows/ \
                      | sed 's/.*scripts\.//' | sort -u) || true

          # 진입점을 하나도 못 찾았다면 워크플로의 호출 방식이 바뀐 것이다.
          # 그대로 통과시키면 이 검사가 조용히 무력해진다.
          if [ -z "$modules" ]; then
            echo "::error::워크플로에서 'python -m scripts.*' 호출을 찾지 못했습니다. 이 검사의 패턴을 함께 고치세요."
            exit 1
          fi

          status=0
          for m in $modules; do
            if [ -f "backend/scripts/$m.py" ]; then
              echo "  ok      backend/scripts/$m.py"
            else
              echo "::error::워크플로가 부르는 backend/scripts/$m.py 가 없습니다. need-umbrella 에서 이름이 바뀌었는지 확인하세요."
              status=1
            fi
          done
          exit $status

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run backend test suite
        working-directory: ./backend
        # 테스트는 네트워크를 타지 않는다. 실행 환경에 키가 들어 있으면 조용히
        # 실제 API 를 호출하게 되므로, 여기서도 비워 두어 그 경로를 막는다.
        env:
          OPENWEATHER_API_KEY: ''
          KMA_SERVICE_KEY: ''
          SESSION_SECRET_KEY: ci-test-secret
        run: pytest -q
