name: Weather Data Sync Pipeline

on:
  schedule:
    # KST (한국 시간): 0, 3, 6, 7, 8, 9, 11, 13, 15, 17, 18, 19, 21, 23시
    # UTC (협정 세계시): 0, 2, 4, 6, 8, 9, 10, 12, 14, 15, 18, 21, 22, 23시
    - cron: '0 0,2,4,6,8,9,10,12,14,15,18,21,22,23 * * *'


  workflow_dispatch: # GitHub 웹 UI에서 수동 실행 지원

jobs:
  update-weather:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v3
        with:
          token: ${{ secrets.GH_PAT }}

      - name: Set up Python 3.10
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run pytest unit tests
        working-directory: ./backend
        run: |
          pytest test_weather.py

      - name: Fetch and generate weather JSON
        env:
          OPENWEATHER_API_KEY: ${{ secrets.OPENWEATHER_API_KEY }}
        run: |
          python backend/main.py

      - name: Commit and push changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git pull origin main --rebase --autostash
          git add weather_all.json
          if ! git diff --staged --quiet; then
            git commit -m "chore: auto-update weather_all.json [skip ci]"
            git push origin main
          fi
