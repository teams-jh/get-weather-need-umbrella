name: Weather Data Sync Pipeline

on:
  schedule:
    # 매일 06:00, 12:00, 18:00 KST (UTC 21:00, 03:00, 09:00) 자동 실행
    - cron: '0 21,3,9 * * *'
  workflow_dispatch: # GitHub 웹 UI에서 수동 실행 지원

jobs:
  update-weather:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v3
        with:
          token: ${{ secrets.GH_PAT }}

      - name: Set up Python 3.10
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run pytest unit tests
        working-directory: ./backend
        run: |
          pytest test_weather.py

      - name: Fetch and generate weather JSON
        env:
          OPENWEATHER_API_KEY: ${{ secrets.OPENWEATHER_API_KEY }}
        run: |
          python backend/main.py

      - name: Commit and push changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Bot"
          git add weather_all.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: auto-update weather_all.json [skip ci]" && git push)
